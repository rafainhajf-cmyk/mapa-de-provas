<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- Painel LM (mercado de moeda) -->
  <g id="painel-lm">
    <text x="130" y="20" text-anchor="middle" font-weight="bold">Mercado de moeda (LM)</text>
    <line x1="60" y1="260" x2="60" y2="40" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="60" y1="260" x2="360" y2="260" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="45" y="45">i</text>
    <text x="345" y="280">y</text>
    <line x1="90" y1="230" x2="320" y2="70" stroke="#000" stroke-width="2"/>
    <text x="330" y="66" font-weight="bold">LM</text>
    <text x="90" y="110">excesso de oferta</text>
    <text x="90" y="126">de moeda</text>
    <text x="230" y="150">excesso</text>
    <text x="230" y="166">de demanda</text>
    <text x="230" y="182">de moeda</text>
  </g>

  <!-- Painel IS (mercado de bens) -->
  <g id="painel-is" transform="translate(400,0)">
    <text x="130" y="20" text-anchor="middle" font-weight="bold">Mercado de bens (IS)</text>
    <line x1="60" y1="260" x2="60" y2="40" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="60" y1="260" x2="360" y2="260" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="45" y="45">i</text>
    <text x="345" y="280">y</text>
    <line x1="90" y1="60" x2="320" y2="230" stroke="#000" stroke-width="2"/>
    <text x="330" y="246" font-weight="bold">IS</text>
    <text x="210" y="100">excesso de oferta</text>
    <text x="210" y="116">de bens</text>
    <text x="75" y="180">excesso de demanda</text>
    <text x="75" y="196">de bens</text>
  </g>
</svg>
