<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Arial, sans-serif" font-size="12">
  <title>Inclinação das curvas IS e LM: mais inclinadas (menos sensíveis) e menos inclinadas (mais sensíveis)</title>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
  </defs>
  <style>.ax{stroke:#222;stroke-width:2;fill:none}.dash{stroke:#444;stroke-dasharray:4 3;fill:none}.dl{stroke:#222;stroke-width:1.2}.t{fill:#222}.h{font-weight:bold;font-size:14px}</style>

  <text x="20" y="22" class="t h">IS e LM mais inclinadas (menos sensíveis)</text>
  <!-- painel 1: IS íngreme -->
  <g transform="translate(40,40)">
    <path class="ax" d="M20,200 L20,10" marker-end="url(#ar)"/><path class="ax" d="M20,200 L260,200" marker-end="url(#ar)"/>
    <text x="28" y="14" class="t">Juros (i)</text><text x="200" y="218" class="t">Renda (Y)</text>
    <line x1="70" y1="20" x2="110" y2="180" stroke="#d62828" stroke-width="3"/><text x="115" y="182" class="t">IS</text>
    <path class="dash" d="M20,60 L80,60 L80,200"/><path class="dash" d="M20,150 L102,150 L102,200"/>
    <line class="dl" x1="12" y1="62" x2="12" y2="148" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
    <line class="dl" x1="82" y1="210" x2="100" y2="210" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
  </g>
  <!-- painel 2: LM íngreme -->
  <g transform="translate(340,40)">
    <path class="ax" d="M20,200 L20,10" marker-end="url(#ar)"/><path class="ax" d="M20,200 L260,200" marker-end="url(#ar)"/>
    <text x="28" y="14" class="t">Juros (i)</text><text x="200" y="218" class="t">Renda (Y)</text>
    <line x1="70" y1="180" x2="110" y2="20" stroke="#1d3fd6" stroke-width="3"/><text x="115" y="24" class="t">LM</text>
    <path class="dash" d="M20,60 L100,60 L100,200"/><path class="dash" d="M20,150 L78,150 L78,200"/>
    <line class="dl" x1="12" y1="62" x2="12" y2="148" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
    <line class="dl" x1="80" y1="210" x2="98" y2="210" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
  </g>

  <text x="20" y="292" class="t h">IS e LM menos inclinadas (mais sensíveis)</text>
  <!-- painel 3: IS plana -->
  <g transform="translate(40,300)">
    <path class="ax" d="M20,200 L20,10" marker-end="url(#ar)"/><path class="ax" d="M20,200 L260,200" marker-end="url(#ar)"/>
    <text x="28" y="14" class="t">Juros (i)</text><text x="200" y="218" class="t">Renda (Y)</text>
    <line x1="40" y1="70" x2="230" y2="160" stroke="#d62828" stroke-width="3"/><text x="234" y="166" class="t">IS</text>
    <path class="dash" d="M20,95 L80,95 L80,200"/><path class="dash" d="M20,130 L170,130 L170,200"/>
    <line class="dl" x1="12" y1="97" x2="12" y2="128" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
    <line class="dl" x1="82" y1="210" x2="168" y2="210" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
  </g>
  <!-- painel 4: LM plana -->
  <g transform="translate(340,300)">
    <path class="ax" d="M20,200 L20,10" marker-end="url(#ar)"/><path class="ax" d="M20,200 L260,200" marker-end="url(#ar)"/>
    <text x="28" y="14" class="t">Juros (i)</text><text x="200" y="218" class="t">Renda (Y)</text>
    <line x1="40" y1="160" x2="230" y2="70" stroke="#1d3fd6" stroke-width="3"/><text x="234" y="72" class="t">LM</text>
    <path class="dash" d="M20,95 L177,95 L177,200"/><path class="dash" d="M20,130 L103,130 L103,200"/>
    <line class="dl" x1="12" y1="97" x2="12" y2="128" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
    <line class="dl" x1="105" y1="210" x2="175" y2="210" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
  </g>
</svg>
